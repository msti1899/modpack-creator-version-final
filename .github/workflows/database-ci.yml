name: Database CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database checks
    runs-on: ubuntu-24.04
    # A cold runner pulls the Supabase images before the first check runs.
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      # The stack is disposable by construction: scripts/db-local.sh only accepts the local
      # commands, creates a loopback-bound network, and never reads a hosted connection.
      - name: Start the local Supabase stack
        run: bun run db:start
      - name: Run the pgTAP suites
        run: bun run db:test
      - name: Run the multi-session concurrency checks
        run: bun run db:test:concurrency
      - name: Run the signed-token PostgREST checks
        run: bun run db:test:postgrest
      - name: Stop the local stack
        if: always()
        run: bun run db:stop
