name: Feature request
description: Propose an improvement with a clear problem and success criteria.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Describe the user need first. Do not include credentials or private information.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this, and what is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior and its scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Explain how someone can verify the improvement is complete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Optional. Include alternatives considered or relevant constraints.
